<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project ELEVATE — Skill & Livelihood Interest Survey</title>
<style>
  :root{
    --navy:#1F3A5F; --accent:#2E7D6B; --grey:#5A5A5A; --light:#EAF0EE;
    --border:#CBD5D1; --bg:#F4F6F5; --error:#B23B3B; --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:#222;
    font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans','Noto Sans Devanagari',Roboto,Arial,sans-serif;line-height:1.55}
  .wrap{max-width:720px;margin:0 auto;padding:16px}

  .langbar{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin:12px 0 0;flex-wrap:wrap}
  .langbar .lbl{font-size:12.5px;color:var(--grey);margin-right:2px}
  .langbar button{border:1px solid var(--border);background:#fff;color:var(--navy);
    border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .langbar button.active{background:var(--navy);color:#fff;border-color:var(--navy)}

  .masthead{display:flex;gap:12px;align-items:stretch;margin:10px 0 18px}
  .masthead .logocol{flex:0 0 150px;background:#fff;border:1px solid var(--border);
    border-radius:var(--radius);display:flex;align-items:center;justify-content:center;padding:14px}
  .masthead .logocol img{max-width:100%;height:auto;display:block}
  .masthead header.band{flex:1 1 auto;margin:0}
  header.band{background:var(--navy);color:#fff;border-radius:var(--radius);padding:22px 20px}
  header.band .tag{font-size:12px;letter-spacing:2px;text-transform:uppercase;
    color:#AFC6BE;font-weight:700;margin-bottom:6px}
  header.band h1{margin:0;font-size:21px;font-weight:700}
  header.band p{margin:8px 0 0;font-size:14px;color:#D8E2DE}

  .consent{background:var(--light);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px 18px;font-size:14px;margin-bottom:18px}
  .consent p{margin:0 0 10px}
  .consent p:last-child{margin-bottom:0}
  .consent strong{color:var(--navy)}

  .gate{background:#fff;border:2px solid var(--accent);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:18px}
  .gate-q{margin:0 0 14px;font-size:15px;font-weight:600;color:var(--navy)}
  .gate-actions{display:flex;flex-wrap:wrap;gap:10px}
  .btn-accept{background:var(--accent);color:#fff;border:0;border-radius:9px;
    padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;flex:1 1 auto;font-family:inherit}
  .btn-decline{background:#fff;color:var(--grey);border:1px solid var(--border);
    border-radius:9px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;flex:0 1 auto;font-family:inherit}
  .btn-decline:hover{border-color:var(--error);color:var(--error)}
  .declined{display:none;background:#fff;border:1px solid var(--border);
    border-radius:var(--radius);padding:34px 24px;text-align:center;margin-bottom:18px}
  .declined h2{color:var(--navy);margin:0 0 8px}
  .declined p{color:var(--grey);font-size:15px;margin:0}

  .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 18px 6px;margin-bottom:16px}
  .sec-title{color:var(--accent);font-weight:700;font-size:15px;
    text-transform:uppercase;letter-spacing:.5px;margin:0 0 4px}
  .sec-sub{color:var(--grey);font-size:13px;margin:0 0 14px}
  .field{margin-bottom:15px}
  label.q{display:block;font-weight:600;font-size:14.5px;margin-bottom:6px}
  .req{color:var(--error);margin-left:3px}
  .hint{font-weight:400;color:var(--grey);font-size:12.5px;display:block;margin-top:2px}
  input[type=text],input[type=tel],input[type=number],select,textarea{
    width:100%;padding:10px 12px;font-size:15px;border:1px solid var(--border);
    border-radius:8px;background:#fff;font-family:inherit;color:#222}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(46,125,107,.15)}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opts label{flex:1 1 auto;min-width:calc(50% - 8px);display:flex;align-items:center;
    gap:8px;border:1px solid var(--border);border-radius:8px;padding:9px 11px;
    font-size:14px;cursor:pointer;background:#fff}
  .opts label:hover{border-color:var(--accent)}
  .opts input{accent-color:var(--accent);width:auto;margin:0}
  .rank-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .rank-badge{flex:0 0 86px;font-size:13px;font-weight:700;color:var(--navy)}
  .err{color:var(--error);font-size:12.5px;margin-top:5px;display:none}
  .field.invalid .err{display:block}
  .field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--error)}
  .actions{margin:8px 0 40px;text-align:center}
  button.submit{background:var(--accent);color:#fff;border:0;border-radius:10px;
    padding:14px 34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
  button.submit:disabled{opacity:.6;cursor:not-allowed}
  .note{font-size:12px;color:var(--grey);text-align:center;margin-top:10px}
  .thankyou{display:none;background:#fff;border:1px solid var(--border);
    border-radius:var(--radius);padding:40px 24px;text-align:center}
  .thankyou h2{color:var(--accent);margin:0 0 8px}
  .thankyou p{color:var(--grey);font-size:15px;margin:0}
  .banner{display:none;background:#FBEAEA;border:1px solid var(--error);color:var(--error);
    border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:14px}
  @media(max-width:480px){.opts label{min-width:100%}.rank-badge{flex-basis:72px}
    .masthead{flex-direction:column}.masthead .logocol{flex-basis:auto}}
</style>
</head>

    why_b:{en:"Under Project ELEVATE, we are planning skill-training and income opportunities in your area. This short survey helps us understand which trades you are most interested in, so training can be planned around real interest. It takes about 8–10 minutes.",mr:"प्रोजेक्ट ELEVATE मध्ये आम्ही तुमच्या भागात कामाचं प्रशिक्षण व कमाईच्या संधी तयार करतोय. तुम्हाला कोणतं काम जास्त आवडेल हे या छोट्या फॉर्ममधून समजेल, म्हणजे त्यानुसार प्रशिक्षण ठरवता येईल. यासाठी साधारण 8–10 मिनिटं लागतात.",hi:"प्रोजेक्ट ELEVATE में हम आपके इलाके में काम की ट्रेनिंग व कमाई के मौके बना रहे हैं। आपको कौन-सा काम ज़्यादा पसंद है यह इस छोटे फॉर्म से पता चलेगा, ताकि उसी हिसाब से ट्रेनिंग तय हो सके। इसमें करीब 8–10 मिनट लगते हैं।"},
    info_h:{en:"Your information.",mr:"तुमची माहिती.",hi:"आपकी जानकारी।"},
    info_b:{en:"The details you share, including your name and contact number, are collected only for Project ELEVATE. They will be kept confidential, stored securely, and used solely by the project team to plan training and to contact you about training and livelihood opportunities under this project. Your information will not be shared with, sold to, or used by any other person or organisation for any other purpose. Taking part is voluntary, and you may choose not to answer.",mr:"तुम्ही दिलेली माहिती, तुमचं नाव व फोन नंबरसह, फक्त प्रोजेक्ट ELEVATE साठीच घेतली जाते. ती गुप्त ठेवली जाईल, सुरक्षित ठेवली जाईल, आणि फक्त प्रोजेक्ट टीमच प्रशिक्षण ठरवण्यासाठी व या प्रोजेक्टमधल्या प्रशिक्षण व कमाईच्या संधींबद्दल तुमच्याशी संपर्क करण्यासाठी वापरेल. तुमची माहिती इतर कोणाला दिली जाणार नाही, विकली जाणार नाही किंवा दुसऱ्या कशासाठीही वापरली जाणार नाही. हा फॉर्म भरणं ऐच्छिक आहे, तुम्ही एखाद्या प्रश्नाचं उत्तर न देणंही निवडू शकता.",hi:"आपकी दी हुई जानकारी, आपके नाम व फोन नंबर समेत, सिर्फ़ प्रोजेक्ट ELEVATE के लिए ली जाती है। इसे गुप्त रखा जाएगा, सुरक्षित रखा जाएगा, और सिर्फ़ प्रोजेक्ट टीम ही ट्रेनिंग तय करने व इस प्रोजेक्ट की ट्रेनिंग व कमाई के मौकों के बारे में आपसे संपर्क करने के लिए इस्तेमाल करेगी। आपकी जानकारी किसी और को न दी जाएगी, न बेची जाएगी, न किसी और काम के लिए इस्तेमाल होगी। यह फॉर्म भरना आपकी मर्ज़ी है, आप किसी सवाल का जवाब न देना भी चुन सकते हैं।"},

    gate_q:{en:"Do you agree to take part in this survey and to be contacted by the project team about training and livelihood opportunities under Project ELEVATE, on the terms described above?",mr:"वर नमूद केलेल्या अटींनुसार, या सर्वेक्षणात सहभागी होण्यास आणि प्रोजेक्ट ELEVATE अंतर्गत प्रशिक्षण व उपजीविकेच्या संधींबाबत प्रकल्प संघाने तुमच्याशी संपर्क साधण्यास तुमची संमती आहे का?",hi:"ऊपर बताई गई शर्तों के अनुसार, क्या आप इस सर्वेक्षण में भाग लेने और प्रोजेक्ट ELEVATE के तहत प्रशिक्षण व आजीविका के अवसरों के बारे में परियोजना टीम द्वारा संपर्क किए जाने के लिए सहमत हैं?"},
    gate_yes:{en:"Yes, I agree — start the survey",mr:"होय, मी सहमत आहे — सर्वेक्षण सुरू करा",hi:"हाँ, मैं सहमत हूँ — सर्वेक्षण शुरू करें"},
    gate_no:{en:"No, I do not agree",mr:"नाही, मी सहमत नाही",hi:"नहीं, मैं सहमत नहीं हूँ"},
    dec_h:{en:"Thank you",mr:"धन्यवाद",hi:"धन्यवाद"},
    dec_b:{en:"No problem. The survey has been closed and no information has been collected. If you change your mind, you can open this form again at any time.",mr:"हरकत नाही. सर्वेक्षण बंद केले आहे आणि कोणतीही माहिती घेतलेली नाही. तुमचा विचार बदलल्यास, तुम्ही हा फॉर्म कधीही पुन्हा उघडू शकता.",hi:"कोई बात नहीं। सर्वेक्षण बंद कर दिया गया है और कोई जानकारी एकत्र नहीं की गई है। यदि आप अपना मन बदलते हैं, तो आप इस फ़ॉर्म को किसी भी समय फिर से खोल सकते हैं।"},

/* =================== RENDER ENGINE =================== */
  let LANG = "mr";
  function buildSelect(sel){
    const list = OPTS[sel.getAttribute("data-opts")];
    const cur = sel.value;
    sel.innerHTML = list.map(o=>`<option value="${o.v}">${o[LANG]}</option>`).join("");
    if(cur) sel.value = cur;
  }
  function buildRadio(div){
    const list = OPTS[div.getAttribute("data-opts")];
    const name = div.closest(".field").getAttribute("data-group");
    const cur = div.querySelector(`input:checked`)?.value || "";
    div.innerHTML = list.map(o=>
      `<label><input type="radio" name="${name}" value="${o.v}"${o.v===cur?" checked":""}>${o[LANG]}</label>`
    ).join("");
  }
  function buildChecks(div){
    const key = div.getAttribute("data-checks");
    const list = OPTS[key];
    const checked = new Set([...div.querySelectorAll("input:checked")].map(i=>i.value));
    div.innerHTML = list.map(o=>
      `<label><input type="checkbox" name="${key}" value="${o.v}"${checked.has(o.v)?" checked":""}>${o[LANG]}</label>`
    ).join("");
  }
  function applyLang(){
    document.documentElement.lang = LANG;
    document.querySelectorAll("[data-i]").forEach(el=>{
      const k = el.getAttribute("data-i");
      if(T[k]) el.textContent = T[k][LANG];
    });
    document.querySelectorAll("select[data-opts]").forEach(buildSelect);
    document.querySelectorAll(".opts[data-opts]").forEach(buildRadio);
    document.querySelectorAll(".opts[data-checks]").forEach(buildChecks);
    document.querySelectorAll(".langbar button").forEach(b=>
      b.classList.toggle("active", b.getAttribute("data-lang")===LANG));
    if(typeof refreshTradeExclusivity==="function") refreshTradeExclusivity();
  }
  document.querySelectorAll(".langbar button").forEach(b=>
    b.addEventListener("click",()=>{ LANG=b.getAttribute("data-lang"); applyLang(); }));
  applyLang();

/* =================== CONDITIONAL FIELDS =================== */
  const show=(el,on)=>{el.style.display=on?"block":"none";};
  document.getElementById("area").addEventListener("change",e=>
    show(document.getElementById("area_other_wrap"), e.target.value==="Other"));
  document.addEventListener("change",e=>{
    if(e.target.name==="pwd")
      show(document.getElementById("pwd_type_wrap"),
           document.querySelector('input[name=pwd]:checked')?.value==="Yes");
    if(e.target.name==="why")
      show(document.getElementById("why_other_wrap"),
           !!document.querySelector('input[name=why][value="Other"]:checked'));
  });
  function refreshTradeOther(){
    const vals=[...document.querySelectorAll(".trade-select")].map(s=>s.value);
    show(document.getElementById("trade_other_wrap"), vals.includes("Other"));
  }
  // Hide a trade already picked in another dropdown, so the same one can't be chosen twice.
  // "Other" and the blank "Select" option stay available everywhere.
  function refreshTradeExclusivity(){
    const selects=[...document.querySelectorAll(".trade-select")];
    const chosen=selects.map(s=>s.value).filter(v=>v && v!=="Other");
    selects.forEach(sel=>{
      [...sel.options].forEach(opt=>{
        if(opt.value==="" || opt.value==="Other"){opt.hidden=false;opt.disabled=false;return;}
        const takenElsewhere = chosen.includes(opt.value) && opt.value!==sel.value;
        opt.hidden=takenElsewhere;
        opt.disabled=takenElsewhere;
      });
    });
  }
  document.querySelectorAll(".trade-select").forEach(s=>s.addEventListener("change",()=>{
    refreshTradeOther();
    refreshTradeExclusivity();
  }));

/* =================== CONSENT GATE =================== */
  const form=document.getElementById("surveyForm");
  const gate=document.getElementById("gate");
  const makeId=()=>"c_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
  function logConsent(decision){
    if(!db) return;
    db.collection(CONSENT_COLLECTION).add({
      consent:decision, consent_id:consentId, language:LANG,
      logged_at:firebase.firestore.FieldValue.serverTimestamp(),
      user_agent:navigator.userAgent
    }).catch(e=>console.error("Consent log failed:",e));
  }

  // ---- Aggregate counters (numbers only, no personal data) ----
  // Stored in stats/aggregates so a public dashboard can read counts without
  // ever touching the responses collection. All updates are atomic increments.
  const INC = n => firebase.firestore.FieldValue.increment(n);
  const statsRef = () => db.collection("stats").doc("aggregates");
  const todayKey = () => {   // local date YYYY-MM-DD
    const d=new Date(); const p=x=>String(x).padStart(2,"0");
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
  };
  function bumpConsentStats(decision){
    if(!db) return;
    statsRef().set({
      consent:{[decision]:INC(1)}
    },{merge:true}).catch(e=>console.error("consent stat:",e));
  }
  function bumpResponseStats(data){
    if(!db) return;
    const u={};
    u.total = INC(1);
    u.byDate = {[todayKey()]: INC(1)};
    if(data.area)   u.byArea   = {[data.area]: INC(1)};
    if(data.gender) u.byGender = {[data.gender]: INC(1)};
    if(data.pwd)    u.byPwd    = {[data.pwd]: INC(1)};
    // trades: weighted (1st=3,2nd=2,3rd=1) and raw mention count.
    // The three slots are mutually exclusive, so each trade appears at most once.
    const tw={}, tm={};
    [["trade1",3],["trade2",2],["trade3",1]].forEach(([k,wt])=>{
      const v=data[k]; if(v){ tw[v]=INC(wt); tm[v]=INC(1); }
    });
    if(Object.keys(tw).length) u.tradeWeighted = tw;
    if(Object.keys(tm).length) u.tradeMentions = tm;
    statsRef().set(u,{merge:true}).catch(e=>console.error("response stat:",e));
  }
  document.getElementById("btnAccept").addEventListener("click",()=>{
    consentId=makeId(); logConsent("accepted"); bumpConsentStats("accepted");
    gate.style.display="none";
    document.getElementById("declined").style.display="none";
    form.style.display="block";
    form.scrollIntoView({behavior:"smooth",block:"start"});
  });
  document.getElementById("btnDecline").addEventListener("click",()=>{
    consentId=makeId(); logConsent("declined"); bumpConsentStats("declined");
    gate.style.display="none"; form.style.display="none";
    document.getElementById("declined").style.display="block";
    window.scrollTo({top:0,behavior:"smooth"});
  });

/* =================== VALIDATION =================== */
  function validate(){
    let firstBad=null;
    form.querySelectorAll(".field").forEach(f=>f.classList.remove("invalid"));
    form.querySelectorAll('.field[data-required]').forEach(f=>{
      if(f.hasAttribute("data-group")){
        const name=f.getAttribute("data-group");
        if(!form.querySelector(`input[name="${name}"]:checked`)){f.classList.add("invalid");firstBad=firstBad||f;}
        return;
      }
      if(f.hasAttribute("data-rank")){
        const vals=[...f.querySelectorAll(".trade-select")].map(s=>s.value);
        const filled=vals.every(v=>v!=="");
        const uniq=new Set(vals).size===vals.length;
        if(!filled||!uniq){f.classList.add("invalid");firstBad=firstBad||f;}
        return;
      }
      if(f.hasAttribute("data-check")){
        if(!f.querySelector('input[type=checkbox]:checked')){f.classList.add("invalid");firstBad=firstBad||f;}
        return;
      }
      const input=f.querySelector("input,select,textarea");
      if(!input)return;
      let bad=!input.value.trim();
      if(input.id==="phone")bad=!/^[6-9]\d{9}$/.test(input.value.trim());
      if(input.id==="family_size"){const n=+input.value;bad=!(n>=1&&n<=30);}
      if(bad){f.classList.add("invalid");firstBad=firstBad||f;}
    });
    if(firstBad)firstBad.scrollIntoView({behavior:"smooth",block:"center"});
    return !firstBad;
  }

/* =================== SUBMIT =================== */
  const banner=document.getElementById("banner");
  form.addEventListener("submit",async e=>{
    e.preventDefault();
    banner.style.display="none";
    if(!validate())return;
    const btn=document.getElementById("submitBtn");
    btn.disabled=true;btn.textContent=T.submitting[LANG];
    if(!db){
      banner.textContent=T.err_nodb[LANG];banner.style.display="block";
      btn.disabled=false;btn.textContent=T.submit[LANG];return;
    }
    const fd=new FormData(form);
    const data=Object.fromEntries(fd.entries());
    // multi-select "why": join all ticked reasons into one readable field
    data.why=fd.getAll("why").join("; ");
    data.consent_id=consentId;
    data.language=LANG;
    data.submitted_at=firebase.firestore.FieldValue.serverTimestamp();
    data.user_agent=navigator.userAgent;
    try{
      await db.collection(COLLECTION).add(data);
      bumpResponseStats(data);   // numbers-only aggregate for the dashboard
      form.style.display="none";
      document.getElementById("thankyou").style.display="block";
      window.scrollTo({top:0,behavior:"smooth"});
    }catch(err){
      console.error(err);
      banner.textContent=T.err_net[LANG];banner.style.display="block";
      btn.disabled=false;btn.textContent=T.submit[LANG];
    }
  });
</script>
</body>
</html>
